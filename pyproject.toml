[project]
name = "tax"
version = "0.3.2"
description = "Task Agent eXchange — push notifications and remote reply for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Sergio Malkin"},
]
keywords = ["agent", "push", "notifications", "orca", "pi"]
dependencies = [
    "typer>=0.27.0",
    "requests>=2.34.2",
    "fastapi>=0.140.7",
    "uvicorn[standard]>=0.51.0",
    "httpx[http2]>=0.28.1",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "cryptography>=49.0.0",
    "websockets>=16.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.5.0",
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[project.scripts]
tax = "tax.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tax"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Keep the CI lint contract explicit so new Ruff releases cannot enable new
# rule families and break an otherwise unchanged commit.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
