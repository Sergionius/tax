[project]
name = "tax"
version = "0.1.0"
description = "Task Agent eXchange — push notifications and remote reply for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Sergio Malkin"},
]
keywords = ["agent", "push", "notifications", "agterm", "pi"]
dependencies = [
    "typer>=0.12",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx[http2]>=0.27",
    "pydantic>=2.6",
    "pyjwt>=2.8",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
tax = "tax.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tax"]

[tool.ruff]
line-length = 120
