name: Python quality

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'server/requirements.txt'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'server/requirements.txt'
      - '.github/workflows/python.yml'

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # Keep in sync with [tool.uv] required-version in pyproject.toml.
  UV_VERSION: '0.12.13'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv
        run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev ruff check server src tests
      - run: uv run --locked --extra dev pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned uv
        run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --extra dev
      - run: uv build
      - name: Verify exported requirements match the lock
        run: |
          uv export --no-dev --no-emit-project -o server/requirements.txt
          git diff --exit-code -- server/requirements.txt
      - name: Install wheel in a clean venv
        run: |
          python -m venv /tmp/tax-wheel
          /tmp/tax-wheel/bin/pip install dist/*.whl
          /tmp/tax-wheel/bin/tax --help
          /tmp/tax-wheel/bin/tax notify --help
          /tmp/tax-wheel/bin/tax run --help
          /tmp/tax-wheel/bin/tax remote-host --help

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject generated files and secrets in Git
        run: |
          if git ls-files | grep -E '(^|/)(\.env$|[^/]+\.p8$|[^/]+\.(db|sqlite|sqlite3)$|__pycache__/|xcuserdata/)|\.pyc$'; then
            echo 'Generated or sensitive file is tracked' >&2
            exit 1
          fi
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned uv
        run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev --with pip-audit pip-audit
