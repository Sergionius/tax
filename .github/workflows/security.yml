name: Repository safety

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check the public tree of the tracked snapshot
        # The scanner reads the tracked set via `git ls-files`; ignored
        # local files (private skills, plans, configuration) are never
        # traversed. This check covers the current tracked snapshot only:
        # a clean result does not validate the private Git history that
        # predates publication.
        run: python3 scripts/check-public-tree.py
      - name: Reject generated files and secrets in Git
        run: |
          if git ls-files | grep -E '(^|/)(\.env$|[^/]+\.p8$|[^/]+\.(db|sqlite|sqlite3)$|__pycache__/|xcuserdata/)|\.pyc$'; then
            echo 'Generated or sensitive file is tracked' >&2
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout@v7; full history so Gitleaks can scan what is
      # pushed. Gitleaks findings do not re-validate or clean the private
      # history from before publication.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action@v3
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
