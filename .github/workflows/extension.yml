name: Pi extension quality

on:
  push:
    branches: [main]
    paths:
      - 'extensions/**'
      - 'tests/extension/**'
      - 'package.json'
      - '.github/workflows/extension.yml'
  pull_request:
    paths:
      - 'extensions/**'
      - 'tests/extension/**'
      - 'package.json'
      - '.github/workflows/extension.yml'

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node@v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm test
