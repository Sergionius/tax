name: Pi extension quality

on:
  push:
    branches: [main]
    paths:
      - 'extensions/**'
      - 'package.json'
      - '.github/workflows/extension.yml'
  pull_request:
    paths:
      - 'extensions/**'
      - 'package.json'
      - '.github/workflows/extension.yml'

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm test
