name: iOS quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: ios/tax/tax.xcodeproj
  SCHEME: tax

jobs:
  unit-tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Select an installed iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          ids = [device["udid"] for devices in data["devices"].values() for device in devices if device["name"].startswith("iPhone")]
          if not ids:
              raise SystemExit("No available iPhone simulator")
          print(ids[0])
          ')
          echo "DESTINATION=platform=iOS Simulator,id=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:taxTests \
            -resultBundlePath unit-tests.xcresult \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Upload unit test result
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unit-tests-xcresult
          path: unit-tests.xcresult

  ui-tests:
    runs-on: macos-26
    timeout-minutes: 30
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Select an installed iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          ids = [device["udid"] for devices in data["devices"].values() for device in devices if device["name"].startswith("iPhone")]
          if not ids:
              raise SystemExit("No available iPhone simulator")
          print(ids[0])
          ')
          echo "DESTINATION=platform=iOS Simulator,id=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Run mock UI smoke tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:taxUITests \
            -resultBundlePath ui-tests.xcresult \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Upload UI test result
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-tests-xcresult
          path: ui-tests.xcresult
