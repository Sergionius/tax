name: iOS quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: ios/tax/tax.xcodeproj
  SCHEME: tax
  DESTINATION: platform=iOS Simulator,name=iPhone 17

jobs:
  unit-tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:taxTests \
            -resultBundlePath unit-tests.xcresult \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Upload unit test result
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-unit-tests-xcresult
          path: unit-tests.xcresult

  ui-tests:
    runs-on: macos-26
    timeout-minutes: 30
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Run mock UI smoke tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:taxUITests \
            -resultBundlePath ui-tests.xcresult \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Upload UI test result
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-tests-xcresult
          path: ui-tests.xcresult
