version: 2
updates:
  - package-ecosystem: uv
    directory: /
    # Generated export: update pyproject.toml/uv.lock instead, then regenerate.
    exclude-paths:
      - "server/requirements.txt"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
